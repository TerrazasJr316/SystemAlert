# Listener MQTT estándar (ESP32 se conecta aquí)
listener 1883
protocol mqtt

# Listener WebSocket (útil para pruebas desde browser/Postman)
listener 9001
protocol websockets

# En producción: password_file + tls
allow_anonymous true

# Persistencia de mensajes en disco
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Shared subscriptions (MQTT 5 — necesario para balanceo entre instancias MS1)
# Permite que múltiples suscriptores del mismo grupo reciban mensajes repartidos
# Topic formato: $share/<grupo>/<topic>
