events {
  worker_connections 1024;
}

http {

  # ─────────────────────────────────────────
  # Upstream: 3 instancias de MS1
  # ─────────────────────────────────────────
  upstream ms1_cluster {
    least_conn;
    server ms1-1:3000;
    server ms1-2:3000;
    server ms1-3:3000;
  }

  server {
    listen 80;

    # Health check del balanceador
    location /health {
      return 200 'nginx ok\n';
      add_header Content-Type text/plain;
    }

    # Todo el tráfico HTTP hacia el cluster MS1
    location / {
      proxy_pass http://ms1_cluster;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Header útil para la demo: muestra qué instancia respondió
      add_header X-Served-By $upstream_addr;
    }
  }
}
