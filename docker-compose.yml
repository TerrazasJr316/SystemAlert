version: "3.9"

networks:
  c5-network:
    driver: bridge

volumes:
  redis-data:
  mosquitto-data:
  mosquitto-log:

services:

  # ─────────────────────────────────────────
  # BROKER MQTT
  # ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: c5-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - c5-network

  # ─────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: c5-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - c5-network

  # ─────────────────────────────────────────
  # MS1 — RECEPCIÓN DE ALERTAS (3 instancias)
  # ─────────────────────────────────────────
  ms1-1:
    build:
      context: ./services/ms1
      dockerfile: Dockerfile
    container_name: c5-ms1-1
    restart: unless-stopped
    environment:
      - INSTANCE_ID=ms1-1
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=$$share/grupo-ms1/alerts/panic/+
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_STREAM=alerts-stream
    depends_on:
      - mosquitto
      - redis
    networks:
      - c5-network

  ms1-2:
    build:
      context: ./services/ms1
      dockerfile: Dockerfile
    container_name: c5-ms1-2
    restart: unless-stopped
    environment:
      - INSTANCE_ID=ms1-2
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=$$share/grupo-ms1/alerts/panic/+
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_STREAM=alerts-stream
    depends_on:
      - mosquitto
      - redis
    networks:
      - c5-network

  ms1-3:
    build:
      context: ./services/ms1
      dockerfile: Dockerfile
    container_name: c5-ms1-3
    restart: unless-stopped
    environment:
      - INSTANCE_ID=ms1-3
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=$$share/grupo-ms1/alerts/panic/+
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_STREAM=alerts-stream
    depends_on:
      - mosquitto
      - redis
    networks:
      - c5-network

  # ─────────────────────────────────────────
  # NGINX
  # ─────────────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: c5-nginx
    restart: unless-stopped
    ports:
      - "80:80"      
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - ms1-1
      - ms1-2
      - ms1-3
    networks:
      - c5-network
